name: Sync Repo to Google Drive

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Push files to Drive
        env:
          DRIVE_SYNC_URL: ${{ secrets.DRIVE_SYNC_URL }}
          REPO_NAME: ${{ github.event.repository.name }}
          COMMIT_SHA: ${{ github.sha }}
          COMMIT_MSG: ${{ github.event.head_commit.message }}
        run: |
          node -e '
            const fs = require("fs");
            const path = require("path");

            const REPO = process.env.REPO_NAME;
            const SKIP_DIRS = new Set([".git", ".github", "node_modules"]);
            const ALLOWED_EXT = new Set([".html", ".htm", ".js", ".css", ".json", ".md", ".txt", ".py", ".sh", ".yml", ".yaml"]);

            function walk(dir, base = "") {
              let results = [];
              for (const entry of fs.readdirSync(dir, { withFileTypes: true })) {
                if (SKIP_DIRS.has(entry.name)) continue;
                const full = path.join(dir, entry.name);
                const rel = base ? base + "/" + entry.name : entry.name;
                if (entry.isDirectory()) {
                  results = results.concat(walk(full, rel));
                } else if (ALLOWED_EXT.has(path.extname(entry.name).toLowerCase())) {
                  results.push(rel);
                }
              }
              return results;
            }

            const files = [];
            const manifestLines = [
              REPO + " LIVE MANIFEST",
              "====================",
              "Commit: " + (process.env.COMMIT_SHA || "").slice(0, 12),
              "Message: " + String(process.env.COMMIT_MSG || "manual sync").split("\n")[0],
              "Synced (IST): " + new Date(Date.now() + 19800000).toISOString().replace("T", " ").slice(0, 19) + " IST",
              "",
              "FILES:"
            ];

            for (const rel of walk(".")) {
              const content = fs.readFileSync(rel, "utf8").replace(/\r\n/g, "\n");
              const lines = content.split("\n").length;
              const driveName = REPO + "_" + rel.replace(/\//g, "_") + ".txt";
              files.push({ name: driveName, content });
              manifestLines.push("- " + rel + " -> " + driveName + " (" + lines + " lines, " + content.length + " chars)");
            }

            files.unshift({ name: REPO + "_INDEX.txt", content: manifestLines.join("\n") + "\n" });

            (async () => {
              const res = await fetch(process.env.DRIVE_SYNC_URL, {
                method: "POST",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify({ files }),
                redirect: "follow"
              });
              const txt = await res.text();
              console.log("Drive Sync Response:", res.status, txt);
              const j = JSON.parse(txt);
              if (!j.ok) process.exit(1);
            })().catch(err => {
              console.error(err);
              process.exit(1);
            });
          '
